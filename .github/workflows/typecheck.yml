name: Typecheck

# Fast TypeScript gate for pull requests (ported from the rider-app repo).
# Playwright runs tests via esbuild, which strips types without checking them,
# so type errors can otherwise reach main unnoticed. This runs `tsc --noEmit`
# and needs no browsers, so it's quick feedback alongside the full suite.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
