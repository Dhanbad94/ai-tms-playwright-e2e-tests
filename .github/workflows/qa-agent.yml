name: QA Agent (report-only)

# v1 of the AI QA Agent described in docs/QA_AGENT_PROMPT.md, run with Claude
# Code in headless mode. Modelled on the rider-app repo's qa-agent.yml, keeping
# the fixes from its real runs (pipefail, token whitespace, fail-loudly).
#
# REPORT-ONLY: it runs the impacted tests, triages failures, then posts a Slack
# summary and uploads a JSON result. It cannot change anything:
#   - the job token is read-only (permissions: contents: read);
#   - the agent may only read files and run Playwright (Edit/Write/web tools
#     denied; everything not allowlisted is auto-denied via --permission-mode dontAsk);
#   - credentials reach the agent only as env vars for its test runs; reading
#     .env*, auth state and /proc is denied;
#   - production is never a target (input choice + guard step).
#   - the full transcript (every tool call, its output, refused calls) is kept,
#     but only after .github/scripts/qa_agent_transcript.py redacts every
#     *_PASSWORD value and the Claude token; the raw stream never reaches an
#     artifact or the job log.
#
# Runs on a schedule (Mon/Wed/Fri) and on demand. Each run reads the previous
# successful run's saved result to compare build stamps; when the app source is
# available, it diffs the environment's deployed branch (staging-ecs /
# preprod-ecs) since that run. Ported from the rider-app repo's qa-agent.yml.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  long-lived token from `claude setup-token` (uses the
#                            team's Claude subscription — no per-token API billing)
# Already configured: STAGING_* / PREPRODUCTION_* test accounts, SLACK_WEBHOOK_URL.
# Operator app source (optional; without it the run is in NO-DIFF mode: baseline
# tests + triage only, no change-to-feature mapping):
#   variable APP_REPO             the repo, e.g. TrackMyShuttle/<repo>
#   secret   APP_REPO_DEPLOY_KEY  private half of a READ-ONLY deploy key whose
#                                 public half an admin added to that repo
#                                 (preferred: scoped to one repo, never expires)
#   secret   APP_REPO_READ_TOKEN  alternative: fine-grained token, Contents: read
# If the key/token can't check out the repo (e.g. not authorised yet), the run
# warns and falls back to NO-DIFF mode instead of failing.

on:
  # Mon/Wed/Fri 09:30 UTC, after the scheduled production (05:00), staging
  # smoke (06:00), preprod (07:00) and Tue/Thu regression (08:00) runs.
  schedule:
    - cron: '30 9 * * 1,3,5'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test (production is never allowed)'
        type: choice
        options: [staging, preproduction]
        default: staging
      commit_range:
        description: 'App commit range, e.g. abc1234..def5678 (blank = commits since the last successful agent run on the deployed branch). Ignored in no-diff mode.'
        type: string
        required: false
      spec:
        description: 'Release notes / acceptance criteria for this change (optional)'
        type: string
        required: false

permissions:
  contents: read
  actions: read   # find the previous successful run and its saved result

concurrency:
  group: qa-agent
  cancel-in-progress: false

jobs:
  qa-agent:
    runs-on: ubuntu-24.04
    # Agent budget is 30 min (QA_AGENT_PROMPT.md hard rule 8); the extra time
    # covers checkout, npm ci and the browser install.
    timeout-minutes: 45
    # Explicit `shell: bash` runs steps with `-eo pipefail`. Without it GitHub
    # uses plain `bash -e`, and `claude ... | tee` reports tee's success even
    # when the agent fails (seen on the rider-app agent's first run).
    defaults:
      run:
        shell: bash
    env:
      CI: true
      # Scheduled runs have no inputs, so default to staging.
      ENV: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APP_REPO: ${{ vars.APP_REPO }}
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
          APP_REPO_DEPLOY_KEY: ${{ secrets.APP_REPO_DEPLOY_KEY }}
          STAGING_MANAGER_EMAIL: ${{ secrets.STAGING_MANAGER_EMAIL }}
          STAGING_MANAGER_PASSWORD: ${{ secrets.STAGING_MANAGER_PASSWORD }}
          PREPRODUCTION_MANAGER_EMAIL: ${{ secrets.PREPRODUCTION_MANAGER_EMAIL }}
          PREPRODUCTION_MANAGER_PASSWORD: ${{ secrets.PREPRODUCTION_MANAGER_PASSWORD }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing required secret CLAUDE_CODE_OAUTH_TOKEN (create it with: claude setup-token). Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            *[[:space:]]*) echo "::warning::CLAUDE_CODE_OAUTH_TOKEN contains whitespace or a line break (likely a wrapped copy/paste). It is stripped before use; re-save the secret as a single line to silence this." ;;
          esac

          # The test accounts for the chosen environment must exist, or every
          # test fails at login and the run is meaningless.
          case "$ENV" in
            staging)       E="$STAGING_MANAGER_EMAIL";       P="$STAGING_MANAGER_PASSWORD";       PFX=STAGING ;;
            preproduction) E="$PREPRODUCTION_MANAGER_EMAIL"; P="$PREPRODUCTION_MANAGER_PASSWORD"; PFX=PREPRODUCTION ;;
            *) echo "::error::Refusing environment '$ENV' (only staging/preproduction)"; exit 1 ;;
          esac
          if [ -z "$E" ] || [ -z "$P" ]; then
            echo "::error::Missing ${PFX}_MANAGER_EMAIL or ${PFX}_MANAGER_PASSWORD secret — every test would fail at login."
            exit 1
          fi

          # Secrets can't be used in step `if:` conditions, so expose which app-repo
          # credential exists (deploy key preferred) and the deployed branch.
          if [ -z "$APP_REPO" ]; then
            echo "app_repo_auth=none" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_REPO variable not set: running in NO-DIFF mode (baseline tests + triage only, no change-to-feature mapping)."
          elif [ -n "$APP_REPO_DEPLOY_KEY" ]; then
            echo "app_repo_auth=deploy_key" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_REPO_READ_TOKEN" ]; then
            echo "app_repo_auth=token" >> "$GITHUB_OUTPUT"
          else
            echo "app_repo_auth=none" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_REPO is set but there's no APP_REPO_DEPLOY_KEY / APP_REPO_READ_TOKEN: running in NO-DIFF mode."
          fi
          # The deployed code lives on the environment's *-ecs branch.
          case "$ENV" in
            staging)       echo "app_branch=staging-ecs" >> "$GITHUB_OUTPUT" ;;
            preproduction) echo "app_branch=preprod-ecs" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4

      # continue-on-error: a credential that isn't authorised yet (or a missing
      # branch) must fall back to NO-DIFF mode, not fail the run.
      - name: Checkout app source (deploy key, read-only)
        id: app_key
        if: steps.secrets.outputs.app_repo_auth == 'deploy_key'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          ref: ${{ steps.secrets.outputs.app_branch }}
          ssh-key: ${{ secrets.APP_REPO_DEPLOY_KEY }}
          path: app-src
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout app source (token, read-only)
        id: app_token
        if: steps.secrets.outputs.app_repo_auth == 'token'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          ref: ${{ steps.secrets.outputs.app_branch }}
          token: ${{ secrets.APP_REPO_READ_TOKEN }}
          path: app-src
          fetch-depth: 0
          persist-credentials: false

      - name: App source access
        id: app
        env:
          AUTH: ${{ steps.secrets.outputs.app_repo_auth }}
          KEY_OUTCOME: ${{ steps.app_key.outcome }}
          TOKEN_OUTCOME: ${{ steps.app_token.outcome }}
          BRANCH: ${{ steps.secrets.outputs.app_branch }}
        run: |
          if [ "$KEY_OUTCOME" = "success" ] || [ "$TOKEN_OUTCOME" = "success" ]; then
            echo "has_app_repo=true" >> "$GITHUB_OUTPUT"
            echo "App source $BRANCH checked out via $AUTH."
          else
            echo "has_app_repo=false" >> "$GITHUB_OUTPUT"
            if [ "$AUTH" != "none" ]; then
              echo "::warning::Could not check out the app source ($BRANCH) with the $AUTH (not authorised yet, or no such branch?). Falling back to NO-DIFF mode."
            fi
            rm -rf app-src
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Retry with backoff; treat the apt font deps as best-effort (core libs
        # ship in the runner image).
        run: |
          retry() {
            local n=1 max=3 delay=20
            until "$@"; do
              if [ "$n" -ge "$max" ]; then return 1; fi
              echo "::warning::'$*' failed (attempt $n/$max); retrying in ${delay}s"
              sleep "$delay"; n=$((n+1)); delay=$((delay*2))
            done
          }
          retry npx playwright install chromium
          retry npx playwright install-deps chromium \
            || echo "::warning::Playwright system deps could not be installed after retries; continuing"

      - name: Install Claude Code
        # Pinned so CLI flags stay stable; bump deliberately (same version as the rider-app agent).
        run: npm install -g @anthropic-ai/claude-code@2.1.332

      - name: Resolve run inputs
        id: inputs
        env:
          INPUT_RANGE: ${{ inputs.commit_range }}
          HAS_APP_REPO: ${{ steps.app.outputs.has_app_repo }}
          BRANCH: ${{ steps.secrets.outputs.app_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ENV" in
            staging)       BASE_URL=https://php-staging.trackmyshuttle.com ;;
            preproduction) BASE_URL=https://php-preprod.trackmyshuttle.com ;;
            *) echo "::error::Refusing environment '$ENV' (only staging/preproduction)"; exit 1 ;;
          esac

          # Previous successful agent run for this environment (newest first, one
          # whose result artifact still exists): its start time bounds the commit
          # range, and its saved result holds the previous build stamp. Since
          # agent-runs/ is the only upload path, the files sit at the artifact
          # root; take the newest timestamped JSON (the run's own result).
          PREV_TIME=""; PREV_BUILD="none"
          PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow qa-agent.yml --status success --limit 20 \
                   --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"' 2>/dev/null || true)
          while read -r id created; do
            [ -z "$id" ] && continue
            rm -rf prev-run
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "qa-agent-$ENV-$id" --dir prev-run >/dev/null 2>&1; then
              f=$(find prev-run -name '2*.json' | sort | tail -1)
              b=""; [ -n "$f" ] && b=$(jq -r '.build_version // empty' "$f" 2>/dev/null || true)
              # Only a real stamp counts (older runs may hold "unknown" or prose).
              if printf '%s' "$b" | grep -qE '^[0-9]{8}-[0-9]+$'; then
                PREV_TIME="$created"; PREV_BUILD="$b"; break
              fi
            fi
          done <<< "$PREV"
          rm -rf prev-run

          RANGE="$INPUT_RANGE"; RANGE_NOTE=""
          if [ "$HAS_APP_REPO" != "true" ]; then
            [ -n "$RANGE" ] && echo "::warning::commit_range ignored: the app source isn't available in this run."
            RANGE="unavailable"
          elif [ -n "$RANGE" ]; then
            if ! printf '%s' "$RANGE" | grep -qE '^[0-9a-fA-F]{7,40}\.\.[0-9a-fA-F]{7,40}$'; then
              echo "::error::commit_range must look like <sha>..<sha> (7-40 hex chars each)"; exit 1
            fi
            RANGE_NOTE="given as input"
          else
            HEAD_SHA=$(git -C app-src rev-parse HEAD)
            if [ -n "$PREV_TIME" ]; then
              BASE=$(git -C app-src rev-list -1 --before="$PREV_TIME" HEAD)
              RANGE_NOTE="commits on $BRANCH since the last successful agent run ($PREV_TIME)"
            else
              # --verify -q prints nothing when HEAD~10 doesn't exist (a plain rev-parse
              # echoes the literal 'HEAD~10', which then breaks rev-list below).
              BASE=$(git -C app-src rev-parse --verify -q 'HEAD~10' 2>/dev/null || true)
              RANGE_NOTE="commits since HEAD~10 on $BRANCH (no earlier agent run found)"
            fi
            [ -z "$BASE" ] && BASE=$(git -C app-src rev-list --max-parents=0 HEAD | tail -1)
            RANGE="$BASE..$HEAD_SHA"
            RANGE_NOTE="$RANGE_NOTE; $(git -C app-src rev-list --count "$RANGE") commit(s)"
          fi

          # Build fingerprint: the app exposes no commit and /version is a 404.
          # Its page assets carry a cache-bust stamp (e.g. settingmap.js?27112026-4,
          # DDMMYYYY-N); take the most common one on the login page.
          # 60s: staging's login page took 18-30s to respond on 2026-11-28.
          BUILD_ID=$(curl -s --max-time 60 "$BASE_URL/login" | grep -oE '\?[0-9]{8}-[0-9]+' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' | tr -d '?' || true)
          [ -z "$BUILD_ID" ] && BUILD_ID="unknown"

          {
            echo "base_url=$BASE_URL"
            echo "range=$RANGE"
            echo "range_note=$RANGE_NOTE"
            echo "build_id=$BUILD_ID"
            echo "prev_build=$PREV_BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "env=$ENV branch=$BRANCH base_url=$BASE_URL range=$RANGE ($RANGE_NOTE) build_id=$BUILD_ID prev_build=$PREV_BUILD"

      - name: Run QA agent (report-only)
        env:
          # Subscription auth only. ANTHROPIC_API_KEY is deliberately NOT passed:
          # an API key outranks the OAuth token and would bill per token.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_URL: ${{ steps.inputs.outputs.base_url }}
          RANGE: ${{ steps.inputs.outputs.range }}
          BUILD_ID: ${{ steps.inputs.outputs.build_id }}
          SPEC: ${{ inputs.spec }}
          HAS_APP_REPO: ${{ steps.app.outputs.has_app_repo }}
          RANGE_NOTE: ${{ steps.inputs.outputs.range_note }}
          PREV_BUILD: ${{ steps.inputs.outputs.prev_build }}
          BRANCH: ${{ steps.secrets.outputs.app_branch }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          # Test accounts for the chosen environment only, as env vars (never
          # written to .env.local, which the agent could read).
          STAGING_MANAGER_EMAIL: ${{ (inputs.environment || 'staging') == 'staging' && secrets.STAGING_MANAGER_EMAIL || '' }}
          STAGING_MANAGER_PASSWORD: ${{ (inputs.environment || 'staging') == 'staging' && secrets.STAGING_MANAGER_PASSWORD || '' }}
          STAGING_OPERATOR_EMAIL: ${{ (inputs.environment || 'staging') == 'staging' && secrets.STAGING_OPERATOR_EMAIL || '' }}
          STAGING_OPERATOR_PASSWORD: ${{ (inputs.environment || 'staging') == 'staging' && secrets.STAGING_OPERATOR_PASSWORD || '' }}
          PREPRODUCTION_MANAGER_EMAIL: ${{ (inputs.environment || 'staging') == 'preproduction' && secrets.PREPRODUCTION_MANAGER_EMAIL || '' }}
          PREPRODUCTION_MANAGER_PASSWORD: ${{ (inputs.environment || 'staging') == 'preproduction' && secrets.PREPRODUCTION_MANAGER_PASSWORD || '' }}
          PREPRODUCTION_OPERATOR_EMAIL: ${{ (inputs.environment || 'staging') == 'preproduction' && secrets.PREPRODUCTION_OPERATOR_EMAIL || '' }}
          PREPRODUCTION_OPERATOR_PASSWORD: ${{ (inputs.environment || 'staging') == 'preproduction' && secrets.PREPRODUCTION_OPERATOR_PASSWORD || '' }}
        run: |
          # Tokens never contain whitespace; strip any that a wrapped copy/paste
          # added (a line break here made the rider-app agent's first run fail auth).
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN

          mkdir -p agent-runs
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "TS=$TS" >> "$GITHUB_ENV"

          # The system prompt is the section of docs/QA_AGENT_PROMPT.md between
          # its two '---' rules, plus the report-only override below.
          PROMPT=$(awk '/^---$/{n++; next} n==1' docs/QA_AGENT_PROMPT.md)

          if [ "$HAS_APP_REPO" = "true" ]; then
            DIFF_NOTE='- The operator app source is checked out read-only at ./app-src. Read the change with `git -C app-src log <range>` and `git -C app-src diff <range>`.'
            RANGE_DESC="$RANGE — $RANGE_NOTE (operator app $BRANCH, checked out at ./app-src)"
          else
            DIFF_NOTE='- NO-DIFF MODE: the app source is not available in this run, so there is no diff and no ./app-src directory. Skip Step 1, run the baseline tests (Step 2.1: @smoke on staging, all of @prod on preproduction), triage every failure, set "features_changed" to [] and state in the Slack summary that the diff was unavailable.'
            RANGE_DESC="unavailable (no app-repo access this run)"
          fi

          if [ "$ENV" = "preproduction" ]; then
            ENV_NOTE='- PREPRODUCTION: run EVERY @prod test, not just @smoke: `npx playwright test --project=chromium --grep @prod`. That is the baseline here and replaces the @smoke run in Step 2.1. Only read-only tests: never run @crud, @e2e or @negative tests here.'
          else
            ENV_NOTE='- STAGING: run data-changing (@crud) tests serially with `--workers=1`.'
          fi

          OVERRIDE_HEAD=$(cat <<'EOF'
          ## RUN MODE OVERRIDE — REPORT-ONLY (v1)
          This run is REPORT-ONLY. These rules override anything above:
          - Do NOT edit or create files, open branches or pull requests, or create or comment on issues. Skip Step 4 (test authoring), Step 5 (bug hunting) and the PR/issue parts of Steps 3 and 6.
          - Still classify every failure (APP_BUG / TEST_OUTDATED / LOCATOR_BROKEN / FLAKY / ENV_ISSUE / NEEDS_HUMAN) and state the action you WOULD take.
          - build_version was already read from the deployed page by the workflow. Use it as given; fetching pages yourself isn't permitted here, so don't try. Your own transcript file in agent-runs/ is being written as you work; it is not a previous run.
          - Run tests only with `npx playwright test --project=chromium ...`. The environment is fixed by the workflow (ENV and BASE_URL are already set); never override them. Login is handled by the setup project.
          EOF
          )
          OVERRIDE_TAIL=$(cat <<'EOF'
          - Never print environment variables, credentials or auth state.
          - End your reply with exactly these two marked blocks, which the workflow extracts:
          ===SLACK===
          <the Step 6 Slack summary, plain text, phone-readable>
          ===END SLACK===
          ===JSON===
          <the Step 6 JSON result object, valid JSON only>
          ===END JSON===
          EOF
          )

          OVERRIDE="$OVERRIDE_HEAD
          $DIFF_NOTE
          $ENV_NOTE
          $OVERRIDE_TAIL"

          # previous_build_version comes from the last successful run's saved result.
          RUN_BLOCK=$(printf 'trigger: %s\nenvironment: %s\nbase_url: %s\ncommit_range: %s\nbuild_version: %s (asset cache-bust stamp, read from the deployed login page by this workflow)\nprevious_build_version: %s (from the last successful agent run; "none" if unavailable)\nspec: %s\njobs: [impact_run, triage]\n' \
            "$TRIGGER" "$ENV" "$BASE_URL" "$RANGE_DESC" "$BUILD_ID" "${PREV_BUILD:-none}" "${SPEC:-none}")

          # Full transcript: stream-json records every tool call the agent makes and
          # its output, plus any call the permission rules refused. The RAW stream
          # goes to a file OUTSIDE agent-runs/ (so it can never be uploaded) and
          # never to the job log: it holds whatever files the agent read, and
          # failure snapshots record typed passwords. qa_agent_transcript.py then
          # writes the redacted .jsonl / .md / .tools.md — even if the agent failed.
          RAW="$RUNNER_TEMP/qa-agent-raw.jsonl"
          rc=0

          # Model pinned so cost and behaviour don't drift with the CLI default.
          claude -p "$RUN_BLOCK" \
            --model claude-opus-5-5 \
            --append-system-prompt "$PROMPT

          $OVERRIDE" \
            --permission-mode dontAsk \
            --output-format stream-json --verbose \
            --allowedTools "Read" "Grep" "Glob" \
              "Bash(npx playwright test:*)" \
              "Bash(git -C app-src log:*)" "Bash(git -C app-src diff:*)" "Bash(git -C app-src show:*)" \
            --disallowedTools "Edit" "Write" "NotebookEdit" "WebFetch" "WebSearch" \
              "Read(./.env*)" "Read(./playwright/.auth/**)" "Read(//proc/**)" \
            < /dev/null > "$RAW" || rc=$?
          # (< /dev/null: no stdin in CI; otherwise the CLI waits 3s for piped input.)

          # Redact, render the transcript files, print the redacted timeline here.
          python3 .github/scripts/qa_agent_transcript.py "$RAW" "agent-runs/$TS" || rc=1
          rm -f "$RAW"
          exit "$rc"

      - name: Extract Slack summary + JSON result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          ts = os.environ.get("TS", "run")
          md = pathlib.Path(f"agent-runs/{ts}.md")
          # errors="replace": stray non-UTF-8 bytes in agent/test output must not
          # crash extraction (that would also lose the Slack summary).
          text = md.read_text(encoding="utf-8", errors="replace") if md.exists() else ""

          def block(name):
              m = re.search(rf"==={name}===\s*(.*?)\s*===END {name}===", text, re.S)
              return m.group(1).strip() if m else ""

          raw = block("JSON")
          try:
              data = json.loads(raw)
          except Exception:
              data = {"error": "agent did not return a valid JSON block"}
          pathlib.Path("agent-runs").mkdir(exist_ok=True)
          pathlib.Path(f"agent-runs/{ts}.json").write_text(json.dumps(data, indent=2))
          pathlib.Path("agent-runs/slack.txt").write_text(block("SLACK"))
          print("json keys:", list(data)[:12])
          PY

      - name: Post Slack summary
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "No Slack webhook configured; skipping"; exit 0; fi
          MSG=$(cat agent-runs/slack.txt 2>/dev/null || true)
          [ -z "$MSG" ] && MSG="QA Agent (report-only) | $ENV | run ended without a summary block — see the run log."
          payload=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1] + "\n\n_Operator web app · report-only dry run_ · " + sys.argv[2]}))' "$MSG" "$RUN_URL")
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null

      - name: Upload agent run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
          path: |
            agent-runs/
          retention-days: 14
          if-no-files-found: ignore

      # Last, so the Slack post and artifact upload above still happen: a run in
      # which the agent produced no result must show red, not green.
      - name: Fail if the agent produced no result
        if: always()
        run: |
          f="agent-runs/${TS:-missing}.json"
          if [ ! -f "$f" ] || python3 -c 'import json,sys; sys.exit(0 if "error" in json.load(open(sys.argv[1])) else 1)' "$f"; then
            echo "::error::The agent did not produce a result. First lines of its output:"
            head -5 "agent-runs/${TS:-missing}.md" 2>/dev/null || echo "(no transcript)"
            exit 1
          fi
          echo "Agent produced a result."
